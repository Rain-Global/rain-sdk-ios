name: CI

on:
  pull_request:
  push:
    branches: [main, 'release/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package-tests:
    name: Package tests (iOS Simulator)
    # Fallback if the org lacks the macos-26 image: runs-on: macos-15, xcode-version: '16.4',
    # SIM_NAME 'iPhone 16 Pro'. swift-tools-version 6.1 needs Xcode >= 16.3.
    runs-on: macos-26
    timeout-minutes: 45
    env:
      SCHEME: RainSDK-Package
      SIM_NAME: iPhone 17 Pro
      # Stream xcodebuild's output instead of block-buffering it, so a hang shows the last
      # thing it was actually doing rather than 50 minutes of silence.
      NSUnbufferedIO: 'YES'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Print toolchain
        run: |
          xcodebuild -version
          swift --version
          sysctl -n hw.ncpu hw.memsize

      - name: Install xcbeautify
        run: brew install xcbeautify

      - name: Cache SwiftPM checkouts
        uses: actions/cache@v4
        with:
          path: .spm-cache
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      # Boot the simulator up front and address it by UDID. A destination resolved by name can
      # sit waiting on a simulator that never comes up, with no output and no error.
      - name: Boot simulator
        id: sim
        timeout-minutes: 6
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available \
            | grep -m1 "^ *${SIM_NAME} (" \
            | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
          if [ -z "$udid" ]; then
            echo "::error::No available simulator named '${SIM_NAME}'"
            xcrun simctl list devices available | grep iPhone || true
            exit 1
          fi
          echo "Booting ${SIM_NAME} ($udid)"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Split from the test run so a compile hang and a test hang are distinguishable, and so
      # neither can burn the whole job budget.
      - name: Build for testing
        timeout-minutes: 25
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            -skipMacroValidation \
            2>&1 | tee build/build.log | xcbeautify --renderer github-actions

      - name: Run tests
        timeout-minutes: 15
        run: |
          set -o pipefail
          # Same cloned-packages path as the build step: without it, test-without-building
          # re-resolves the whole package graph into the default location and can burn the
          # entire step budget on "Checking out ..." before running a single test.
          xcodebuild test-without-building \
            -scheme "$SCHEME" \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath .spm-cache \
            -disableAutomaticPackageResolution \
            2>&1 | tee build/test.log | xcbeautify --renderer github-actions

      # A test-host crash shows up in xcbeautify's output only as a missing "Test run ... passed"
      # line and a later 'Selected tests' relaunch — every visible test green, exit 65. The raw
      # log names the test that was running; print that context and keep the result bundle.
      - name: Show crash context
        if: failure()
        run: |
          grep -nE "Restarting after unexpected exit|crashed|Fatal error|Test Case .* failed|error:" \
            build/test.log | head -50 || echo "no crash markers in test.log"

      - name: Upload test log and result bundle
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            build/test.log
            build/DerivedData/Logs/Test/*.xcresult
          if-no-files-found: ignore

      # Swift Testing reports per-target "Test run with N tests" lines; xcodebuild's own
      # "Executed N tests" counter only covers XCTest and reads 0 here.
      - name: Summarize Swift Testing results
        if: always()
        run: |
          if [ ! -s build/test.log ]; then
            echo "::error::No test log — the run never reached the test phase. Check the build step."
            exit 1
          fi
          {
            echo "## Swift Testing (${SIM_NAME})"
            echo
            echo '```'
            grep -E "Test run with [0-9]+ tests? .*(passed|failed)" build/test.log \
              | sed -E 's/^.*(Test run with)/\1/' | sort -u || echo "no Swift Testing summary lines found"
            echo '```'
            echo
            echo "Skipped (env-gated):"
            echo '```'
            grep -oE 'Test "[^"]*" skipped.*' build/test.log | sort -u || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          runs=$(grep -cE "Test run with [0-9]+ tests? .*passed" build/test.log || true)
          echo "passed test-run lines: $runs"
          if [ "$runs" -lt 1 ]; then
            echo "::error::No test target reported a passing run — see the failures above."
            exit 1
          fi
